<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Аудит задач — B2BAPP</title><link rel="stylesheet" href="../shared.css">
<style>
.au-lead{color:var(--mute);font-size:13px;margin:0 0 12px;line-height:1.45}
.au-chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.au-chip{padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:12.5px}
.au-chip b{font-size:16px;margin-right:4px}
.au-sec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 16px}
.au-sec h2{margin:0 0 4px;font-size:17px}
.au-sec h3{margin:14px 0 6px;font-size:14px}
.au-sub{color:var(--mute);font-size:12px;margin:0 0 8px}
.au-sec .tbl td{vertical-align:top}
.au-jira{display:flex;flex-direction:column;gap:3px}
.au-jira div{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.au-sp{font-size:11px;color:var(--mute)}
.au-sp.no{color:var(--warn);font-weight:600}
.au-keys{line-height:1.9;font-size:12.5px}
.au-keys a{white-space:nowrap}
.au-gl td:first-child{font-weight:700;white-space:nowrap}
details.au-det summary{cursor:pointer;font-weight:600;font-size:13px;margin:6px 0}
.au-tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:4px 0 16px}
.au-tab{padding:9px 13px;cursor:pointer;color:var(--mute);font-size:13px;border-bottom:2px solid transparent;white-space:nowrap;background:none;border-top:0;border-left:0;border-right:0;font-family:inherit}
.au-tab .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--line);color:var(--text);font-size:11px;text-align:center}
.au-tab.active{color:var(--text);border-bottom-color:var(--yel);font-weight:700}
.au-pane{display:none}.au-pane.active{display:block}
.au-nav{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;margin:0 0 10px}
.au-nav a{color:var(--mute)}
.au-sec h3{scroll-margin-top:70px}
.au-a1{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 10px}
.au-a1 h4{margin:0 0 4px;font-size:13.5px}
.au-a1 ul{margin:4px 0 6px;padding-left:18px;font-size:12.5px;line-height:1.5}
.au-a1 .lbl{font-weight:700;font-size:12px;margin-top:6px}
.au-up{float:right;font-size:12px;font-weight:400}
/* фильтры по столбцам и отметка строки (Виктор 23.11.2026) */
.au-flt th{padding-top:4px;padding-bottom:6px;font-weight:400}
.au-flt select,.au-flt input{width:100%;max-width:220px;font:inherit;font-size:12px;padding:3px 4px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--text)}
.au-fbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--mute);margin:0 0 6px}
.au-fbar button{font:inherit;font-size:12px;padding:2px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--text);cursor:pointer}
tr[data-k]{cursor:pointer}
tr.au-seen>td{background:rgba(127,127,127,.08)}
tr.au-seen>td:first-child{box-shadow:inset 3px 0 0 var(--mute)}
tr.au-cur>td{background:rgba(255,196,0,.18)!important}
tr.au-cur>td:first-child{box-shadow:inset 4px 0 0 var(--yel)}
</style></head><body>
<div class="layout">
<div id="sidebar-root"></div>
<script src="../shared-nav.js"></script><script>renderSidebar(); initTheme();
// шапка — дата аудита (audit.json), а не время сборки data.json</script>
<div class="main">
<header class="hdr">
  <div class="hdr-left"><a class="back-btn" href="../index.html">← Главная</a><span class="page-title">🧹 Аудит задач по ответственным</span></div>
  <div class="hdr-right">Данные на <span id="upd">—</span> <span id="freshness" class="freshness"></span><button class="pdf-btn" onclick="toggleTheme()" id="themeBtn" title="Переключить тему" style="margin-left:8px">🌙</button></div>
</header>
<div class="content" id="root"><div class="empty">Загрузка...</div></div>
<script>
// Страница только рисует public/data/audit.json — его готовит build_audit.py при
// каждом обновлении дашборда (спецификация Cowork 11.11.2026). В Jira не ходит.
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const jk=k=>`<a href="https://btask.beeline.ru/browse/${encodeURIComponent(k)}" target="_blank" rel="noopener">${esc(k)}</a>`;
function issuesBlock(o){
  if(!o.issues.length) return '<p class="au-sub">Правок оформления нет.</p>';
  // Все находки — одной таблицей с фильтрами по столбцам (Виктор 23.11.2026)
  return `<table class="tbl au-ft"><thead><tr><th data-f="txt">Ключ</th><th data-f="sel">Сценарий</th><th data-f="codes">Проверка</th><th data-f="sel">MVP</th><th data-f="txt">Что поправить</th></tr></thead><tbody>${
    o.issues.map(i=>`<tr data-k="${esc(i.key)}"><td>${jk(i.key)}</td><td>${esc(i.scenario)}</td><td><span class="badge badge-blue">${esc(i.check)}</span></td><td class="au-sp">${i.outside_mvp?'вне MVP':'MVP'}</td><td>${esc(i.action)}</td></tr>`).join('')}</tbody></table>`;
}
// Итоговые акты ВК-ИТ (F1–F4, Виктор 21.11.2026): финансовые поля Jira Framework 2 — по всему проекту, и вне MVP
function finBlock(o,a){
  const f=o.finance||[];
  if(!f.length) return '<p class="au-sub">Замечаний по полям для итоговых актов нет.</p>';
  return `<table class="tbl au-ft"><thead><tr><th data-f="txt">Ключ</th><th data-f="sel">Исполнитель</th><th data-f="codes">Проверка</th><th data-f="txt">Что сделать</th></tr></thead><tbody>${
    f.map(i=>`<tr data-k="${esc(i.key)}"><td>${jk(i.key)}${i.outside_mvp?' <span class="au-sp">вне MVP</span>':''}<div class="au-sp">${esc(i.summary||'')}</div></td><td>${esc(i.assignee||'—')}</td><td><span class="badge badge-blue">${esc(i.check)}</span></td><td>${esc(i.action)}</td></tr>`).join('')}</tbody></table>`;
}
function scBlock(o){
  const c=o.scenario_checks||[];
  if(!c.length) return '';
  return `<h3 id="${o.id}-sc">Сценарии: отметка о завершении</h3><table class="tbl"><thead><tr><th>Сценарий</th><th>Проверка</th><th>Что сделать</th><th>Ключи</th></tr></thead><tbody>${
    c.map(x=>`<tr><td><b>${esc(x.scenario)}</b></td><td><span class="badge badge-blue">${esc(x.check)}</span></td><td>${esc(x.action)}</td><td class="au-keys">${x.keys.slice(0,12).map(jk).join(', ')}${x.keys.length>12?` и ещё ${x.keys.length-12}`:''}</td></tr>`).join('')}</tbody></table>`;
}
function p4Block(o){
  if(!o.p4.length) return '<p class="au-sub">Отстающих этапов нет.</p>';
  return `<table class="tbl"><thead><tr><th>Сценарий</th><th>Этап</th><th>План</th><th>Что в Jira (незакрытые)</th><th>Что сделать</th></tr></thead><tbody>${
    o.p4.map(p=>`<tr data-k="p4:${esc(p.scenario)}:${esc(p.stage)}"><td><b style="color:var(--yel)">${esc(p.scenario)}</b><div class="au-sp">${esc(p.name||'')}</div></td><td>${esc(p.stage)}</td>
      <td style="white-space:nowrap">${esc(p.plan)}<div class="au-sp">закончился ${fmtDate(p.planEnd)}</div></td>
      <td>${p.kind==='нет'?'<span class="au-sp no">задач роли нет</span>':`<div class="au-jira">${p.jira.map(x=>`<div>${jk(x.key)} ${statusBadge(x.status)} <span class="au-sp${x.sprint?'':' no'}">${x.sprint?esc(x.sprint):'нет в текущем/будущем спринте'}</span></div>`).join('')}</div>${p.closed?`<div class="au-sp">закрыто ${p.closed} из ${p.total}</div>`:''}`}</td>
      <td>${esc(p.action)}</td></tr>`).join('')}</tbody></table>`;
}
// «Для Тимура» (поддержка Jira, заявка GSD-142836): ночной откат Epic Link — что вернуть руками.
// Таблица + готовый текст для чата/заявки (кнопка «Скопировать»).
function timurText(t){
  return t.items.map(x=>`${x.key} (${x.kind==='задача'?'':x.kind+', '}${x.status}): сейчас ${x.now||'без эпика'}, нужно ${x.need||'?'} — https://btask.beeline.ru/browse/${x.key}`).join('\n');
}
function timurBlock(t){
  if(!t) return '';
  const it=t.items||[];
  const head=`<div class="au-sec" id="timur"><h2>Для Тимура — вернуть Epic Link</h2>
    <p class="au-sub">Jira по ночам (учётка «Jira ServiceManager») возвращает эпик у элементов со списаниями — заявка ${jk(t.ticket)}. Пока скрипт не поправили, такие элементы отправляем Тимуру списком. Нужный эпик: у задачи — эпик её истории; у истории, у задачи без истории или в историях с разными эпиками — последний эпик, поставленный командой. ⚠ — проверить перед отправкой. Исправленные из списка уходят сами при следующем обновлении.</p>`;
  if(!it.length) return head+'<p class="au-sub">Откатов, которые надо исправлять, нет.</p></div>';
  return head+`<table class="tbl"><thead><tr><th>Ключ</th><th>Статус</th><th>Сейчас</th><th>Нужно</th><th>Почему</th><th>Откатов</th></tr></thead><tbody>${
    it.map(x=>`<tr><td>${jk(x.key)}${x.kind!=='задача'?` <span class="au-sp">${esc(x.kind)}</span>`:''}<div class="au-sp">${esc((x.summary||'').slice(0,70))}</div></td><td>${statusBadge(x.status)}</td><td>${x.now?jk(x.now):'—'}</td><td>${x.need?`<b>${jk(x.need)}</b>`:'?'}${x.unsure?' ⚠':''}</td><td class="au-sp">${esc(x.why)}</td><td style="white-space:nowrap">${x.reverts}<div class="au-sp">посл. ${fmtDate(x.lastRevert)}</div></td></tr>`).join('')}</tbody></table>
    <p class="au-sub" style="margin-top:10px"><b>Текст для Тимура</b> <button class="pdf-btn" id="timurCopy" type="button">Скопировать</button></p>
    <pre id="timurTxt" style="white-space:pre-wrap;font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto">${esc(timurText(t))}</pre></div>`;
}
// A1: аналитика стори в Confluence не по шаблону — что именно не так, по разделам (Виктор 18.11.2026)
function a1Block(o,a){
  const it=o.analytics||[];
  if(!it.length) return '<p class="au-sub">Страницы аналитики сценариев соответствуют шаблону (или ссылок на них в стори нет — см. S10).</p>';
  const T=a.templates||{}, tl=k=>T[k]?`<a href="https://bwiki.beeline.ru/pages/viewpage.action?pageId=${T[k].id}" target="_blank" rel="noopener">«${esc(T[k].title)}»</a>`:'шаблоном';
  const li=arr=>`<ul>${arr.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
  return it.map(x=>`<div class="au-a1"><h4><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a></h4>
    <div class="au-sp">Сценарий ${esc(x.scenario)} · стори ${x.stories.map(jk).join(', ')} · v${esc(x.version)}, ${fmtDate(x.updated)}${x.by?', '+esc(x.by):''} · сверено с ${tl(x.template)}</div>
    ${x.missing.length?`<div class="lbl">Нет разделов (${x.missing.length}) — добавить с этим номером и названием; нечего писать — «Не применимо»:</div>${li(x.missing)}`:''}
    ${x.renumbered.length?`<div class="lbl">Раздел есть, но номер или название не как в шаблоне (сейчас → по шаблону):</div>${li(x.renumbered)}`:''}
    ${x.empty.length?`<div class="lbl">Пустые разделы — заполнить или написать «Не применимо»:</div>${li(x.empty)}`:''}
  </div>`).join('');
}
// Фильтры по столбцам (Виктор 23.11.2026): у таблиц .au-ft под шапкой — строка фильтров.
// data-f: sel — выпадающий список значений; codes — по отдельным кодам проверок («S5, S10» → S5 и S10); txt — поиск по тексту.
function initFilters(){
  document.querySelectorAll('table.au-ft').forEach(tb=>{
    const ths=[...tb.tHead.rows[0].cells], rows=[...tb.tBodies[0].rows], cell=(r,i)=>(r.cells[i].textContent||'').trim();
    const vals=(r,i,f)=>f==='codes'?cell(r,i).split(/\s*,\s*/).filter(Boolean):[cell(r,i)];
    const fr=document.createElement('tr'); fr.className='au-flt';
    ths.forEach((th,i)=>{ const f=th.dataset.f, c=document.createElement('th'); fr.appendChild(c); if(!f) return;
      if(f==='txt'){ c.innerHTML='<input type="search" placeholder="поиск…">'; return; }
      const cnt={}; rows.forEach(r=>vals(r,i,f).forEach(v=>cnt[v]=(cnt[v]||0)+1));
      const ks=Object.keys(cnt).sort((a,b)=>a.localeCompare(b,'ru',{numeric:true}));
      c.innerHTML=`<select><option value="">все (${rows.length})</option>${ks.map(v=>`<option value="${esc(v)}">${esc(v)} — ${cnt[v]}</option>`).join('')}</select>`; });
    tb.tHead.appendChild(fr);
    const bar=document.createElement('div'); bar.className='au-fbar'; bar.innerHTML='<span class="au-fn"></span><button type="button">Сбросить фильтры</button>';
    tb.parentNode.insertBefore(bar,tb);
    const ctl=[...fr.cells].map(c=>c.querySelector('select,input'));
    const apply=()=>{ let n=0; rows.forEach(r=>{ const ok=ctl.every((el,i)=>{ if(!el||!el.value) return true;
        return el.tagName==='INPUT'?cell(r,i).toLowerCase().includes(el.value.toLowerCase()):vals(r,i,ths[i].dataset.f).includes(el.value); });
        r.style.display=ok?'':'none'; if(ok) n++; });
      bar.querySelector('.au-fn').textContent=n===rows.length?`Строк: ${n}`:`Показано ${n} из ${rows.length}`;
      bar.querySelector('button').style.visibility=n===rows.length?'hidden':'visible'; };
    ctl.forEach(el=>el&&el.addEventListener(el.tagName==='INPUT'?'input':'change',apply));
    bar.querySelector('button').onclick=()=>{ ctl.forEach(el=>el&&(el.value='')); apply(); };
    apply();
  });
}
// Отметка строки (Виктор 23.11.2026): щёлкнул по строке (или по ссылке в ней) — строка подсвечена жёлтым как «текущая»,
// прошлые — серой полосой «уже смотрел». Хранится в браузере (localStorage), переживает переход в Jira и обновление страницы.
function initMarks(){
  const K='au-marks'; let m={cur:null,seen:[]};
  try{ m=Object.assign(m,JSON.parse(localStorage.getItem(K)||'{}')); }catch(_){}
  const id=tr=>(tr.closest('.au-pane')||{}).id+'|'+tr.dataset.k;
  const paint=()=>document.querySelectorAll('tr[data-k]').forEach(tr=>{ const i=id(tr);
    tr.classList.toggle('au-cur',i===m.cur); tr.classList.toggle('au-seen',i!==m.cur&&m.seen.includes(i)); });
  document.getElementById('root').addEventListener('click',e=>{ const tr=e.target.closest('tr[data-k]'); if(!tr) return;
    if(e.target.closest('select,input,button')) return;
    const i=id(tr); m.seen=[...m.seen.filter(x=>x!==i),i].slice(-500); m.cur=i;
    try{ localStorage.setItem(K,JSON.stringify(m)); }catch(_){} paint(); });
  document.querySelectorAll('.au-pane>.au-sub:first-of-type').forEach(p=>{
    const b=document.createElement('button'); b.type='button'; b.className='pdf-btn'; b.style.marginLeft='8px'; b.textContent='Снять отметки строк';
    b.onclick=()=>{ m={cur:null,seen:[]}; try{ localStorage.removeItem(K); }catch(_){} paint(); }; p.appendChild(b); });
  paint();
}
// Страница разбита на вкладки (Виктор 18.11.2026: «как Статус для руководства»): у каждого ответственного свой блок.
AUTH_READY.then(()=>{
fetch('../data/audit.json?t='+Date.now()).then(r=>{ if(!r.ok) throw new Error('nodata'); return r.json(); }).then(a=>{
  document.getElementById('upd').textContent=fmtDate(a.generated_at);
  if(!a.owners||!a.owners.length){ document.getElementById('root').innerHTML='<div class="empty">Данные аудита ещё не сгенерированы.</div>'; return; }
  const sc=a.scope||{}, mp=a.manual_plan||{};
  const total=o=>o.issues.length+(o.scenario_checks||[]).length+o.p4.length+(o.analytics||[]).length+o.unlabeled_stories.length+(o.finance||[]).length;
  // Глоссарий — первой вкладкой (Виктор 19.11.2026)
  const tabs=[{id:'gloss',label:'Глоссарий',n:null},...a.owners.map(o=>({id:o.id,label:o.short,n:total(o)})),
    ...(a.timur?[{id:'timur',label:'Для Тимура',n:(a.timur.items||[]).length}]:[])];
  const own=a.owners.filter(o=>o.scenarios&&o.scenarios.length).map(o=>`${esc(o.name)} — ${o.scenarios.map(esc).join(', ')}`).join('; ');
  const nav=(o,items)=>`<nav class="au-nav">${items.filter(x=>x[2]).map(([id,t,n])=>`<a href="#${o.id}-${id}">${t} ${n}</a>`).join('')}</nav>`;
  const pane=o=>`<div class="au-pane au-sec" id="${o.id}"><h2>Исправить — ${esc(o.name)}</h2>
      <p class="au-sub">${o.issues.length} правок оформления, ${(o.finance||[]).length} замечаний для итоговых актов, ${o.p4.length} отстающих этапов, ${(o.analytics||[]).length} страниц аналитики не по шаблону${o.unlabeled_stories.length?`, ${o.unlabeled_stories.length} стори без метки сценария`:''}.${o.scenarios&&o.scenarios.length?` Сценарии: ${o.scenarios.map(esc).join(', ')}.`:''}${o.fallback?' Сюда же — задачи без сценария и стори вне реестра.':''}</p>
      ${nav(o,[['fin','Итоговые акты',(o.finance||[]).length],['fmt','Оформление',o.issues.length],['sc','Сценарии',(o.scenario_checks||[]).length],['p4','Отстаёт от плана',o.p4.length],['a1','Аналитика по шаблону',(o.analytics||[]).length],['unl','Без метки',o.unlabeled_stories.length]])}
      ${(o.finance||[]).length?`<h3 id="${o.id}-fin">Итоговые акты: поля для актов ВК-ИТ (F1–F4)</h3><p class="au-sub">Все закрытые задачи со списаниями — по ним финансы собирают квартальные акты из «Бизнес-описания»; бизнес-описание обязательно у каждой (галочка «Не добавлять описание» не освобождает); проверка по всему проекту, вне MVP — у РП.</p>${finBlock(o,a)}`:''}
      <h3 id="${o.id}-fmt">Оформление</h3>${issuesBlock(o)}
      ${scBlock(o)}
      <h3 id="${o.id}-p4">Отстаёт от плана (P4)</h3>${p4Block(o)}
      <h3 id="${o.id}-a1">Аналитика в Confluence по шаблону (A1)</h3>${a1Block(o,a)}
      ${o.unlabeled_stories.length?`<h3 id="${o.id}-unl">Стори без метки сценария — определить сценарий и проставить метку</h3><p class="au-keys">${o.unlabeled_stories.map(jk).join(', ')}</p>`:''}
    </div>`;
  document.getElementById('root').innerHTML=`
    <p class="au-lead">Что поправить в Jira и Confluence, чтобы гант и этапы сценариев показывали реальную картину — по ответственным за сценарий (колонка «Владелец» реестра MVP v.2; задача относится к ответственному за сценарий своей стори, а если сценарий за РП или его нет — к аналитику-исполнителю задачи). <b>${esc(a.deadline_note||'')}</b>. Охват — только MVP: ${sc.stories} стори, ${sc.tasks} задач${sc.excluded_tasks!=null?` (вне MVP — ${sc.excluded_stories} стори и ${sc.excluded_tasks} задач — проверяются так же, с пометкой «вне MVP»: SH — у Шевченко, стори аналитика — у него, остальное — у РП)`:''}, данные Jira на ${fmtDate(a.jira_collected_at||a.generated_at)}, текущий — Спринт ${a.current_sprint}. «Отстаёт от плана» (P4) — те же этапы, что заштрихованы на виде <a href="gantt.html?view=stages">«Этапы по сценариям»</a> (${a.p4_total})${mp.version?`, «План ручной» v${esc(mp.version)}`:''}. Расшифровка кодов проверок — во вкладке «Глоссарий».</p>
    <div class="au-tabs" id="tabs" role="tablist">${tabs.map(t=>`<button class="au-tab" data-t="${t.id}">${esc(t.label)}${t.n!=null?`<span class="n">${t.n}</span>`:''}</button>`).join('')}</div>
    ${a.owners.map(pane).join('')}
    ${a.timur?timurBlock(a.timur).replace('class="au-sec" id="timur"','class="au-pane au-sec" id="timur"'):''}
    <div class="au-pane au-sec" id="gloss"><h2>Глоссарий проверок и как это посчитано</h2>
      <table class="tbl au-gl"><thead><tr><th>Код</th><th>Что значит</th></tr></thead><tbody>${(a.glossary||[]).map(g=>`<tr><td>${esc(g.code)}</td><td>${esc(g.text)}</td></tr>`).join('')}</tbody></table>
      <p class="au-sub" style="margin-top:10px">Ответственный — колонка «Владелец» реестра MVP v.2 (${esc(a.registry||'')}): ${own}. Если сценарий за РП или без сценария — находка уходит аналитику-исполнителю задачи, иначе аналитику, который последним менял её привязку, иначе исполнителю стори; кого не нашли — на разбор РП. Вне MVP (метка «вне_MVP», сценарий SH, эпики вне 10 MVP-эпиков) — те же проверки, с пометкой «вне MVP»: сценарий SH — у Шевченко, стори ведёт аналитик — у него, остальное — у РП. T7 — задачи с оценкой больше ${a.max_task_h||16} ч в «Бэклоге» и «Ready for DEV». A1 сверяет заголовки страниц аналитики, на которые ссылаются стори и их задачи [BA], с шаблонами в Confluence${a.templates&&a.templates.analytics?` («${esc(a.templates.analytics.title)}» v${a.templates.analytics.version}${a.templates.uc?`, «${esc(a.templates.uc.title)}» v${a.templates.uc.version}`:''})`:''}: проверяются страницы «Аналитика: …», с кодом сценария в названии и BC-NN; паспорта доменов (BI-NN), постановки на дизайн и неактуальные — нет. Не флагуем: «Основание», перерасход, «Waiting for release» в текущем спринте, задачи эпика B2BAPP-1 без префикса.</p>
    </div>`;
  initFilters(); initMarks();
  const cb=document.getElementById('timurCopy');
  if(cb) cb.onclick=()=>navigator.clipboard.writeText(timurText(a.timur)).then(()=>{ cb.textContent='Скопировано'; setTimeout(()=>cb.textContent='Скопировать',1500); });
  const show=id=>{ document.querySelectorAll('.au-tab').forEach(x=>x.classList.toggle('active',x.dataset.t===id));
    document.querySelectorAll('.au-pane').forEach(x=>x.classList.toggle('active',x.id===id));
    try{ localStorage.setItem('au-tab',id); }catch(_){} };
  document.getElementById('tabs').addEventListener('click',e=>{ const t=e.target.closest('.au-tab'); if(t) show(t.dataset.t); });
  // ссылка с якорем (#o2, #o2-p4, #timur) — открыть нужную вкладку и прокрутить
  const h=location.hash.slice(1), hEl=h?document.getElementById(h):null, paneId=hEl?(hEl.closest('.au-pane')||{}).id:null;
  let saved=null; try{ saved=localStorage.getItem('au-tab'); }catch(_){}
  show(paneId||(saved&&document.getElementById(saved)?saved:tabs[0].id));
  if(hEl&&!hEl.classList.contains('au-pane')) hEl.scrollIntoView();
}).catch(e=>{ document.getElementById('root').innerHTML='<div class="empty">Данные аудита ещё не сгенерированы.</div>'; });
});
</script></div><!-- /main --></div><!-- /layout -->
</body></html>
