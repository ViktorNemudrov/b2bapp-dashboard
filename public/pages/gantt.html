<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>План и диаграмма Ганта — B2BAPP</title><link rel="stylesheet" href="../shared.css">
<style>
.assum-box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:16px;font-size:12px;line-height:1.6}
.assum-box b{color:var(--yel)}
.assum-list{margin:6px 0 0 18px}

.gantt2-toolbar{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-bottom:14px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.gantt2-toolbar-group{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mute)}
.gantt2-toolbar-group select{background:#1e2d3d;border:1px solid var(--line);color:var(--text);border-radius:5px;padding:3px 8px;font-size:11px;max-width:180px}
.gantt2-toolbar-group button{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--mute);border-radius:5px;padding:3px 9px;font-size:11px;cursor:pointer}
.gantt2-toolbar-group button.on{background:rgba(255,107,61,.15);border-color:var(--yel);color:var(--yel)}
.gantt2-legend{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px;font-size:10px;color:var(--mute)}
.gantt2-legend .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:middle}
.gantt2-body{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.gantt2-tree{width:var(--g2-tree-w,340px);flex-shrink:0;border-right:1px solid var(--line)}
.gantt2-body.g2-tree-collapsed .gantt2-tree,.gantt2-body.g2-tree-collapsed .gantt2-resizer{display:none}
.gantt2-resizer{width:6px;flex-shrink:0;cursor:col-resize;background:transparent;position:relative}
.gantt2-resizer::after{content:'';position:absolute;top:0;bottom:0;left:2px;width:2px;background:var(--line)}
.gantt2-resizer:hover::after,.gantt2-resizer.g2-dragging::after{background:var(--yel)}
.gantt2-tree-header{height:26px;display:flex;align-items:center;padding:0 8px;font-weight:700;font-size:11px;background:#1e2d3d;z-index:4;border-bottom:1px solid var(--line);box-sizing:border-box}
.gantt2-timeline-scroll{overflow-x:auto;flex:1;scrollbar-width:thin;scrollbar-color:#253850 #0d1b2a;cursor:grab}
.gantt2-timeline-scroll.g2-panning{cursor:grabbing;user-select:none}
.gantt2-timeline-scroll::-webkit-scrollbar{height:9px}
.gantt2-timeline-scroll::-webkit-scrollbar-track{background:#0d1b2a}
.gantt2-timeline-scroll::-webkit-scrollbar-thumb{background:#253850;border-radius:5px}
.gantt2-timeline-scroll::-webkit-scrollbar-thumb:hover{background:#354a68}
.gantt2-timeline-inner{position:relative}
.gantt2-row{height:26px;display:flex;align-items:center;border-bottom:1px solid #1a2535;position:relative;box-sizing:border-box}
.gantt2-label{padding:0 8px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:var(--g2-tree-w,340px);box-sizing:border-box;display:flex;align-items:center;gap:4px}
.gantt2-toggle{cursor:pointer;display:inline-block;width:14px;color:var(--mute);flex-shrink:0}
.gantt2-toggle-spacer{display:inline-block;width:14px;flex-shrink:0}
.gantt2-ruler{height:26px;position:relative;background:#1e2d3d;z-index:3;border-bottom:1px solid var(--line);box-sizing:border-box;overflow:hidden}
.gantt2-ruler-mark{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);padding-left:4px;font-size:9px;color:var(--mute);display:flex;align-items:center;white-space:nowrap}
.gantt2-bar{position:absolute;top:3px;height:20px;border-radius:3px;overflow:hidden;cursor:pointer}
.gantt2-bar-fill{position:absolute;left:0;top:0;bottom:0}
.gantt2-bar-name{position:absolute;left:4px;top:0;bottom:0;display:flex;align-items:center;font-size:9px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.7);white-space:nowrap;pointer-events:none;z-index:1;max-width:100%;overflow:hidden}
.gantt2-bar.g2-planned{opacity:.55}
.gantt2-bar.g2-inprogress{outline:1px dashed rgba(255,255,255,.6);animation:g2pulse 2s infinite}
@keyframes g2pulse{0%,100%{outline-color:rgba(255,255,255,.25)}50%{outline-color:rgba(255,255,255,.85)}}
.gantt2-bar.g2-crit{outline:2px solid var(--err)}
.gantt2-bar.g2-overspent{box-shadow:0 0 0 2px var(--err) inset}
.gantt2-bar.g2-overspent::after{content:'⚠';position:absolute;right:2px;top:50%;transform:translateY(-50%);font-size:10px;z-index:2}
.gantt2-bar-ghost{position:absolute;top:3px;height:20px;border-radius:3px;background:rgba(255,255,255,.12);border:1px dashed rgba(255,255,255,.3)}
.gantt2-today-line{position:absolute;top:0;width:2px;background:#00d4ff;z-index:2;pointer-events:none}
.gantt2-milestone-line{position:absolute;top:0;width:2px;background:#9b59b6;z-index:2;pointer-events:none}
.gantt2-hire-line{position:absolute;top:0;width:1px;background:var(--blue);z-index:2;opacity:.6;pointer-events:none}
.g2-type-icon{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;flex-shrink:0}
.g2-type-icon svg{display:block}
.g2-role-chip{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:15px;padding:0 3px;border-radius:4px;font-size:8px;font-weight:800;color:#fff;flex-shrink:0}
body.light-theme .gantt2-tree-header{background:#e8ecf5}
body.light-theme .gantt2-ruler{background:#e8ecf5}
body.light-theme .gantt2-toolbar-group select{background:#fff;border-color:#c0cce0;color:#1a2940}
body.light-theme .gantt2-ruler-mark{border-left-color:#d0d8e8}
body.light-theme .gantt2-timeline-scroll{scrollbar-color:#c0cce0 #e8ecf5}
body.light-theme .gantt2-timeline-scroll::-webkit-scrollbar-track{background:#e8ecf5}
body.light-theme .gantt2-timeline-scroll::-webkit-scrollbar-thumb{background:#c0cce0}
body.g2-fullscreen{overflow:hidden}
body.g2-fullscreen .sidebar,body.g2-fullscreen .hdr{display:none}
body.g2-fullscreen #ganttApp{position:fixed;inset:0;z-index:9999;background:var(--dark);padding:14px;overflow-y:auto;box-sizing:border-box}
.gantt2-line-toggle{display:flex;align-items:center;gap:3px;cursor:pointer}
.pri-controls{display:none;gap:8px;align-items:center;margin-bottom:10px;background:rgba(255,107,61,.08);border:1px solid var(--yel);border-radius:8px;padding:8px 12px;font-size:11px;flex-wrap:wrap}
.pri-controls button{background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--text);border-radius:5px;padding:4px 10px;font-size:11px;cursor:pointer}
.pri-controls button:hover{border-color:var(--yel)}
.pri-msg{color:var(--err);font-weight:600}
.gantt2-tree.pri-active .gantt2-row{cursor:grab}
.gantt2-tree.pri-active .gantt2-row.pri-dragging{opacity:.4}
.gantt2-tree.pri-active .gantt2-row.pri-dragover{background:rgba(255,107,61,.18);box-shadow:inset 0 0 0 1px var(--yel)}
.pri-handle{display:none;flex-shrink:0;width:10px;height:16px}
.gantt2-tree.pri-active .pri-handle{display:inline-flex}
</style></head><body>

<div id="sidebar-root"></div>

fetch('../data/data.json?t='+Date.now()).then(r=>r.json()).then(d=>{

<div class="main">
<header class="hdr">
  <div class="hdr-left"><a class="back-btn" href="../index.html">← Главная</a><span class="page-title">📊 План и диаграмма Ганта</span></div>
  <div class="hdr-right">B2BAPP | Данные на <span id="upd">—</span> <span id="freshness" class="freshness freshness-gray" style="margin-left:8px"></span><button class="pdf-btn" onclick="toggleTheme()" id="themeBtn" title="Переключить тему" style="margin-left:8px">🌙</button></div>
</header>
<div class="content" id="root">
  <div id="ganttEmpty"></div>
  <div id="ganttApp" style="display:none">
    <div class="gantt2-toolbar">
      <div class="gantt2-toolbar-group">
        <label>Показывать:</label>
        <select id="levelFilter">
          <option value="all">Эпики ▸ Стори ▸ Задачи</option>

      <button id="priResetBtn">↺ По умолчанию</button>

<script>
const $ = id => document.getElementById(id);
const ROLE_COLOR={BE:'#FF4444',FE:'#4472C4',BA:'#70AD47',DS:'#FFC803',QA:'#ED7D31',DVO:'#7030A0',ARC:'#00B0F0',ORG:'#A5A5A5'};
// SVG-иконки в стиле Jira (закруглённый квадрат + пиктограмма), не эмодзи/юникод-глиф —
// чёткая отрисовка на любой платформе, ближе к реальным иконкам типов задач в Jira.
const TYPE_ICON={
  epic:'<svg viewBox="0 0 16 16" width="16" height="16"><rect width="16" height="16" rx="3" fill="#8B46FF"/><path d="M9 2L4 9h3l-1 5 6-8H9z" fill="#fff"/></svg>',
  story:'<svg viewBox="0 0 16 16" width="16" height="16"><rect width="16" height="16" rx="3" fill="#63BA3C"/><path d="M5 3h6v10l-3-2-3 2V3z" fill="#fff"/></svg>',
  task:'<svg viewBox="0 0 16 16" width="16" height="16"><rect width="16" height="16" rx="3" fill="#4BADE8"/><path d="M4 8l2.5 2.5L12 5" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
};
const SCALE_PX={week:26,month:6,quarter:2};
const GS={pxPerDay:26,scale:'week',level:'all',expanded:new Set(),baseline:'',resourceFilter:'',_scrolledToToday:false,
  treeWidth:340,treeCollapsed:false,showToday:true,showMilestone:true,showHires:true};

function setTreeWidth(px){
  GS.treeWidth=Math.max(160,Math.min(700,px));
  document.documentElement.style.setProperty('--g2-tree-w', GS.treeWidth+'px');
}

function setupTreeResizer(){
  const resizer=$('ganttResizer');
  resizer.addEventListener('mousedown', e=>{
    e.preventDefault();
    resizer.classList.add('g2-dragging');
    document.body.style.userSelect='none';
    const startX=e.clientX, startW=GS.treeWidth;
    function onMove(ev){ setTreeWidth(startW + (ev.clientX-startX)); }
    function onUp(){
      resizer.classList.remove('g2-dragging');
      document.body.style.userSelect='';
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
}

function toggleTreeCollapsed(){
  GS.treeCollapsed=!GS.treeCollapsed;
  $('ganttApp').querySelector('.gantt2-body').classList.toggle('g2-tree-collapsed', GS.treeCollapsed);
  $('treeCollapseBtn').textContent = GS.treeCollapsed ? '▸ Панель' : '◂ Панель';
}

function toggleFullscreen(){
  document.body.classList.toggle('g2-fullscreen');
  const on=document.body.classList.contains('g2-fullscreen');
  $('fullscreenBtn').textContent = on ? '⤢ Свернуть' : '⛶ На весь экран';
}

// Хватать и тащить область таймлайна зажатой ЛКМ (как в Miro/Figma), а не только
// колёсиком: тянем именно #ganttScroll по горизонтали и обёртку #ganttApp (в полноэкранном
// режиме) или окно (в обычном) по вертикали, чтобы дерево названий и таймлайн не расходились.
function setupGanttPan(){
  const scroller=$('ganttScroll');
  let dragging=false, startX=0, startY=0, startLeft=0, startTop=0, vScroller=null;
  scroller.addEventListener('mousedown', e=>{
    if(e.button!==0) return;
    dragging=true;
    scroller.classList.add('g2-panning');
    startX=e.clientX; startY=e.clientY;
    startLeft=scroller.scrollLeft;
    vScroller = document.body.classList.contains('g2-fullscreen') ? $('ganttApp') : null;
    startTop = vScroller ? vScroller.scrollTop : window.scrollY;
    e.preventDefault();
  });
  document.addEventListener('mousemove', e=>{
    if(!dragging) return;
    scroller.scrollLeft = startLeft - (e.clientX-startX);
    const dy=e.clientY-startY;
    if(vScroller) vScroller.scrollTop = startTop - dy;
    else window.scrollTo(window.scrollX, startTop - dy);
  });
  document.addEventListener('mouseup', ()=>{
    if(!dragging) return;
    dragging=false;
    scroller.classList.remove('g2-panning');
  });
}

function spaceify(s){
  if(!s) return s;
  return s.replace(/^(\d+)([.:)])(?=\S)/,'$1$2 ').replace(/\]([^\s\]])/,'] $1');
}

function buildTree(items){
  const byParent={};
  items.forEach(i=>{ if(i.parent){ (byParent[i.parent]=byParent[i.parent]||[]).push(i); } });
  return items.filter(i=>i.type==='epic').map(e=>({...e, children:(byParent[e.key]||[]).map(s=>({...s, children:byParent[s.key]||[]}))}));
}

function allExpandableKeys(items){
  const s=new Set();
  items.forEach(i=>{ if(i.parent) s.add(i.parent); });
  return [...s];
}

// Оставляет только эпики/стори/задачи, относящиеся к рабочему пути одного исполнителя
// (чтобы увидеть, например, весь путь Аналитика 1 — задачи + их родительские стори/эпики для контекста).
function filterItemsByResource(items, resId){
  if(!resId) return items;
  const matchTasks=items.filter(i=>i.type==='task' && i.resource===resId);
  const keepStoryKeys=new Set(matchTasks.map(t=>t.parent));
  const stories=items.filter(i=>i.type==='story' && keepStoryKeys.has(i.key));
  const keepEpicKeys=new Set(stories.map(s=>s.parent));
  matchTasks.forEach(t=>keepEpicKeys.add(t.epic));
  const epics=items.filter(i=>i.type==='epic' && keepEpicKeys.has(i.key));
  return [...epics, ...stories, ...matchTasks];
}

function buildRulerMarks(minD,maxD,scale,pxPerDay){
  const marks=[]; const d=new Date(minD);
  if(scale==='week'){
    while(d.getDay()!==1) d.setDate(d.getDate()-1);
    while(d<=maxD){ marks.push({x:Math.round((d-minD)/86400000*pxPerDay), label:`${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}`}); d.setDate(d.getDate()+7); }
  } else if(scale==='month'){
    d.setDate(1);
    while(d<=maxD){ marks.push({x:Math.round((d-minD)/86400000*pxPerDay), label:d.toLocaleDateString('ru',{month:'short',year:'2-digit'})}); d.setMonth(d.getMonth()+1); }
  } else {
    d.setMonth(Math.floor(d.getMonth()/3)*3,1);
    while(d<=maxD){ const q=Math.floor(d.getMonth()/3)+1; marks.push({x:Math.round((d-minD)/86400000*pxPerDay), label:`Q${q} ${d.getFullYear()}`}); d.setMonth(d.getMonth()+3); }
  }
  return marks;
}

let ganttTipEl=null, ganttTipBound=false;
function initGanttTooltip(){
  if(!ganttTipEl){ganttTipEl=document.createElement('div');ganttTipEl.className='gls-tip';document.body.appendChild(ganttTipEl);}
  if(ganttTipBound)return; ganttTipBound=true;
  document.addEventListener('mouseover',e=>{
    const t=e.target.closest('.gantt2-bar[data-tip-key]');
    if(!t)return;
    const d=t.dataset;
    ganttTipEl.innerHTML=`<strong>${d.tipKey}</strong> ${d.tipSummary}<div style="margin-top:5px;font-size:10px;color:var(--mute)">Ресурс: ${d.tipResource||'—'}</div><div style="font-size:10px">Оценка/списано: ${d.tipEst}ч / ${d.tipSpent}ч</div><div style="font-size:10px">${d.tipStart} → ${d.tipEnd}</div><div style="font-size:10px;color:var(--mute)">Статус: ${d.tipStatus||'—'}</div>`;
    ganttTipEl.style.display='block';
    const x=Math.min(e.clientX+14,window.innerWidth-296), y=Math.min(e.clientY+14,window.innerHeight-110);
    ganttTipEl.style.left=x+'px';ganttTipEl.style.top=y+'px';
  });
  document.addEventListener('mousemove',e=>{
    if(!ganttTipEl||ganttTipEl.style.display==='none')return;
    if(!e.target.closest('.gantt2-bar[data-tip-key]')){ganttTipEl.style.display='none';}
    else{const x=Math.min(e.clientX+14,window.innerWidth-296),y=Math.min(e.clientY+14,window.innerHeight-110);ganttTipEl.style.left=x+'px';ganttTipEl.style.top=y+'px';}
  });
}

// Скилл иногда присылает ganttV2 как плоский массив агрегатов эпик×роль
// (тот же формат, что старый gantt[]) вместо иерархии {items:[{type,parent,deps...}]} —
// в нём нет story/task-уровня. Строим из него двухуровневое дерево эпик→роль,
// чтобы страница показывала реальные данные, а не пустую заглушку.
function adaptFlatGanttV2(rows, data){
  const epicName={}; (data.epics||[]).forEach(e=>epicName[e.key]=e.name);
  const byEpic={};
  rows.forEach(r=>{(byEpic[r.epic]=byEpic[r.epic]||[]).push(r);});
  const items=[];
  Object.entries(byEpic).forEach(([ek,rs])=>{
    const starts=rs.map(r=>new Date(r.start)).filter(d=>!isNaN(d));
    const ends=rs.map(r=>new Date(r.end)).filter(d=>!isNaN(d));
    if(!starts.length||!ends.length)return;
    const estimateH=rs.reduce((s,r)=>s+(r.h||0),0);
    const spentH=rs.reduce((s,r)=>s+(r.spentH||0),0);
    const allDone=rs.every(r=>r.status==='done'||r.category==='done');
    const anyWip=rs.some(r=>r.status==='in_progress'||r.category==='in_progress');
    items.push({
      key:ek, type:'epic', parent:null, epic:ek, summary:epicName[ek]||ek,
      estimateH, spentH, category:allDone?'done':anyWip?'in_progress':'planned',
      start:new Date(Math.min(...starts)).toISOString().slice(0,10),
      end:new Date(Math.max(...ends)).toISOString().slice(0,10),
      status:allDone?'Завершено':anyWip?'В работе':'Бэклог', onCriticalPath:false, deps:[]
    });
    rs.forEach(r=>{
      // ВАЖНО: r.summary у скилла дублирует название эпика (не описывает роль/работу) —
      // строим осмысленную подпись из роли, иначе все дочерние строки выглядят одинаково.
      const roleLabel=r.roleName && r.roleName!==r.role ? `${r.role} · ${r.roleName}` : (r.role||r.summary||'');
      items.push({
        key:r.key, type:'task', parent:ek, epic:ek, summary:roleLabel, role:r.role,
        estimateH:r.h||0, spentH:r.spentH||0, status:r.status, category:r.status||r.category||'planned',
        start:r.start, end:r.end, resource:r.roleName||r.role, onCriticalPath:false, deps:[]
      });
    });
  });
  return {generatedAt:null, workCalendar:{holidays:[],hoursPerDay:8}, resources:[], items, _flatAdapted:true};
}

let CURRENT_DATA=null, LAST_ITEMS=[];

// ═══════════════════════════════════════════════════════════════════════════
// РЕЖИМ ПРИОРИТЕТОВ: drag&drop-переупорядочивание эпиков/стори/задач с живым
// пересчётом дат в браузере. Планировщик ниже — умышленный порт plan_gantt()
// из build_dashboard.py (очереди ресурсов без простоя + фазовая зависимость
// ролей внутри стори). Если меняется алгоритм в build_dashboard.py (ROLE_PHASE,
// календарь, формула критпути) — синхронизировать и здесь, иначе предпросмотр
// разъедется с тем, что на самом деле посчитает билдер при следующем прогоне.
// ═══════════════════════════════════════════════════════════════════════════
const PRI_ROLE_PHASE={ARC:0, BA:1, DS:2, BE:3, FE:4, QA:5}; // держать = ROLE_PHASE в build_dashboard.py
let PRI_MODE=false, PRI=null, PRI_ITEMS=null, PRI_CRIT=null;

// Все даты держим и сравниваем строго в UTC-компонентах (getUTCDate/setUTCDate/
// getUTCDay), а не local-time getDate/setDate — иначе 'YYYY-MM-DD' (парсится
// как UTC-полночь) и new Date(y,m,d) (local-полночь) плывут друг относительно
// друга на просмотрщиках с отрицательным смещением от UTC.
function priUTC(y,m,d){ return new Date(Date.UTC(y,m,d)); }
function priIsWorkday(d, holidays){
  const day=d.getUTCDay();
  if(day===0||day===6) return false;
  return !holidays.has(d.toISOString().slice(0,10));
}
function priNextWorkday(d, holidays){
  d=new Date(d.getTime());
  while(!priIsWorkday(d,holidays)) d.setUTCDate(d.getUTCDate()+1);
  return d;
}
function priAddWorkHours(start, hours, fte, holidays, hoursPerDay){
  if(hours<=0) return priNextWorkday(start,holidays);
  const cap=Math.max(hoursPerDay*fte, 0.1);
  const daysNeeded=Math.max(1, Math.ceil(Math.round(hours)/Math.round(cap)));
  let d=priNextWorkday(start,holidays), used=1;
  while(used<daysNeeded){
    const nd=new Date(d.getTime()); nd.setUTCDate(nd.getUTCDate()+1);
    d=priNextWorkday(nd, holidays); used++;
  }
  return d;
}

// Начальный порядок — из уже посчитанных приоритетов эпика/стори (server-side
// epicPriority/priority) и фиксированной цепочки ролей, тот же порядок, что
// build_dashboard.py применил при последней сборке. Дальше пользователь может
// перетаскиванием его поменять.
function buildInitialPriorityOrder(items){
  const epics=items.filter(i=>i.type==='epic').slice()
    .sort((a,b)=>(a.priority??9999)-(b.priority??9999) || a.key.localeCompare(b.key));
  const storiesByEpic={}, tasksByStory={};
  items.filter(i=>i.type==='story').forEach(s=>{ (storiesByEpic[s.parent]=storiesByEpic[s.parent]||[]).push(s); });
  Object.keys(storiesByEpic).forEach(ek=>{
    storiesByEpic[ek]=storiesByEpic[ek]
      .sort((a,b)=>(a.priority??9999)-(b.priority??9999) || a.key.localeCompare(b.key))
      .map(s=>s.key);
  });
  items.filter(i=>i.type==='task').forEach(t=>{ (tasksByStory[t.parent]=tasksByStory[t.parent]||[]).push(t); });
  Object.keys(tasksByStory).forEach(sk=>{
    tasksByStory[sk]=tasksByStory[sk]
      .sort((a,b)=>(PRI_ROLE_PHASE[a.role]??99)-(PRI_ROLE_PHASE[b.role]??99) || (a.priority??9999)-(b.priority??9999) || a.key.localeCompare(b.key))
      .map(t=>t.key);
  });
  return {epics: epics.map(e=>e.key), storiesByEpic, tasksByStory};
}

// Пересчёт: done-задачи — факт, не трогаем. in_progress/backlog — заново через
// очереди ресурсов в НОВОМ порядке (epicOrder → storyOrder внутри эпика → фаза
// роли → taskOrder внутри стори, как tie-break).
function recomputeSchedule(items, resources, workCalendar, order){
  const holidays=new Set((workCalendar&&workCalendar.holidays)||[]);
  const hoursPerDay=(workCalendar&&workCalendar.hoursPerDay)||8;
  const tasks=items.filter(i=>i.type==='task');
  const liveTasks=tasks.filter(t=>t.category!=='done');

  const resFree={}; resources.forEach(r=>{ resFree[r.id]=r.from?new Date(r.from):priUTC(2026,0,1); });
  const resByRole={}; resources.forEach(r=>{ (resByRole[r.role]=resByRole[r.role]||[]).push(r); });
  function pickResource(role, earliest){
    const pool=resByRole[role]||resByRole.OTHER||resources;
    let best=null, bestT=null;
    pool.forEach(r=>{
      const rf=r.from?new Date(r.from):earliest;
      const t=new Date(Math.max(resFree[r.id].getTime(), rf.getTime(), earliest.getTime()));
      if(!best||t<bestT){best=r; bestT=t;}
    });
    return best;
  }

  function taskSortKey(t){
    const epicIdx=order.epics.indexOf(t.epic);
    const storyIdx=(order.storiesByEpic[t.epic]||[]).indexOf(t.parent);
    const phase=PRI_ROLE_PHASE[t.role]??99;
    const taskIdx=(order.tasksByStory[t.parent]||[]).indexOf(t.key);
    return [epicIdx<0?9999:epicIdx, storyIdx<0?9999:storyIdx, phase, taskIdx<0?9999:taskIdx, t.key];
  }
  function cmpKey(a,b){ for(let i=0;i<a.length;i++){ if(a[i]<b[i])return -1; if(a[i]>b[i])return 1; } return 0; }
  const ordered=liveTasks.slice().sort((a,b)=>cmpKey(taskSortKey(a),taskSortKey(b)));

  const storyPhaseEnd={}, planned={};
  ordered.forEach(t=>{
    const role=t.role, storyKey=t.parent, phase=PRI_ROLE_PHASE[role];
    let depEnd=null;
    if(phase!==undefined && phase>0){
      const se=storyPhaseEnd[storyKey]||{};
      for(let ph=0; ph<phase; ph++){ if(se[ph] && (!depEnd||se[ph]>depEnd)) depEnd=se[ph]; }
    }
    (t.deps||[]).forEach(dk=>{ const dp=planned[dk]; if(dp && (!depEnd||dp.end>depEnd)) depEnd=dp.end; });
    const res=pickResource(role, depEnd || priUTC(2026,0,1));
    const fte=res.fte||1;
    const earliest=new Date(Math.max(resFree[res.id].getTime(), (res.from?new Date(res.from):priUTC(2026,0,1)).getTime(), (depEnd||priUTC(2026,0,1)).getTime()));
    const remaining=Math.max(t.category==='in_progress' ? (t.estimateH-t.spentH) : t.estimateH, 0);
    const start=priNextWorkday(earliest, holidays);
    const end=priAddWorkHours(start, remaining, fte, holidays, hoursPerDay);
    const nf=new Date(end.getTime()); nf.setDate(nf.getDate()+1);
    resFree[res.id]=priNextWorkday(nf, holidays);
    if(phase!==undefined){
      storyPhaseEnd[storyKey]=storyPhaseEnd[storyKey]||{};
      if(!storyPhaseEnd[storyKey][phase] || end>storyPhaseEnd[storyKey][phase]) storyPhaseEnd[storyKey][phase]=end;
    }
    planned[t.key]={start, end, resource:res.id};
  });

  const byKey={}; tasks.forEach(t=>{ byKey[t.key]=t; });
  const byEpicMap={}; items.filter(i=>i.type==='epic').forEach(e=>{ byEpicMap[e.key]=e; });
  const byStoryMap={}; items.filter(i=>i.type==='story').forEach(s=>{ byStoryMap[s.key]=s; });

  function buildTaskRow(t){
    if(t.category==='done') return {...t};
    const p=planned[t.key];
    if(!p) return {...t};
    return {...t, start:p.start.toISOString().slice(0,10), end:p.end.toISOString().slice(0,10), resource:p.resource, onCriticalPath:false};
  }
  function aggCategory(kids){ return kids.every(k=>k.category==='done')?'done':(kids.some(k=>k.category!=='backlog')?'in_progress':'backlog'); }

  // Строим НЕ по исходному порядку items[] (он произвольный — из Python-set),
  // а строго по order.epics/storiesByEpic/tasksByStory, чтобы дерево в UI
  // визуально шло в том порядке, который сейчас выставлен приоритетом —
  // иначе даты пересчитались бы верно, а строки в дереве не переехали бы.
  const newTasks=[], newStories=[], newEpics=[];
  order.epics.forEach(ek=>{
    const e=byEpicMap[ek];
    if(!e) return;
    const epicKids=[];
    (order.storiesByEpic[ek]||[]).forEach(sk=>{
      const s=byStoryMap[sk];
      if(!s) return;
      const storyKids=[];
      (order.tasksByStory[sk]||[]).forEach(tk=>{
        const t=byKey[tk];
        if(!t) return;
        const row=buildTaskRow(t);
        newTasks.push(row); storyKids.push(row);
      });
      if(storyKids.length){
        newStories.push({...s, start:storyKids.map(k=>k.start).sort()[0], end:storyKids.map(k=>k.end).sort().slice(-1)[0],
          category:aggCategory(storyKids), onCriticalPath:false});
        epicKids.push(...storyKids);
      } else {
        newStories.push({...s, onCriticalPath:false});
      }
    });
    if(epicKids.length){
      newEpics.push({...e, start:epicKids.map(k=>k.start).sort()[0], end:epicKids.map(k=>k.end).sort().slice(-1)[0],
        category:aggCategory(epicKids), onCriticalPath:false});
    } else {
      newEpics.push({...e, onCriticalPath:false});
    }
  });

  let critRes=null, critEnd=null;
  const withDates=newTasks.filter(t=>t.start&&t.end);
  if(withDates.length){
    critEnd=withDates.map(t=>t.end).sort().slice(-1)[0];
    critRes=withDates.find(t=>t.end===critEnd).resource;
    const critTaskKeys=new Set(newTasks.filter(t=>t.resource===critRes).map(t=>t.key));
    const critStoryKeys=new Set(newTasks.filter(t=>critTaskKeys.has(t.key)).map(t=>t.parent));
    const critEpicKeys=new Set(newStories.filter(s=>critStoryKeys.has(s.key)).map(s=>s.epic));
    newTasks.forEach(t=>{ if(critTaskKeys.has(t.key)) t.onCriticalPath=true; });
    newStories.forEach(s=>{ if(critStoryKeys.has(s.key)) s.onCriticalPath=true; });
    newEpics.forEach(e=>{ if(critEpicKeys.has(e.key)) e.onCriticalPath=true; });
  }
  return {items:[...newTasks, ...newStories, ...newEpics], criticalEnd:critEnd, criticalResource:critRes};
}

function recomputeAndRender(){
  const gv=CURRENT_DATA.ganttV2;
  const result=recomputeSchedule(gv.items, gv.resources||[], gv.workCalendar||{}, PRI);
  PRI_ITEMS=result.items;
  PRI_CRIT={end:result.criticalEnd, resource:result.criticalResource};
  renderGanttV2();
}

function priFlash(msg){
  $('priMsg').textContent=msg;
  clearTimeout(priFlash._t);
  priFlash._t=setTimeout(()=>{ $('priMsg').textContent=''; }, 4000);
}

function togglePriorityMode(){
  PRI_MODE=!PRI_MODE;
  $('priModeBtn').classList.toggle('on', PRI_MODE);
  $('priControls').style.display=PRI_MODE?'flex':'none';
  if(PRI_MODE){
    GS.resourceFilter=''; if($('resourceFilter'))$('resourceFilter').value='';
    GS.baseline=''; if($('baselineSelect'))$('baselineSelect').value='';
    if(!PRI) PRI=buildInitialPriorityOrder(CURRENT_DATA.ganttV2.items);
    recomputeAndRender();
  } else {
    renderGanttV2();
  }
}

function resetPriorityOrder(){
  PRI=buildInitialPriorityOrder(CURRENT_DATA.ganttV2.items);
  recomputeAndRender();
  priFlash('Порядок сброшен к исходному расчёту.');
}

function exportPriorityOrder(){
  const items=PRI_ITEMS||CURRENT_DATA.ganttV2.items;
  const tasks=items.filter(i=>i.type==='task').map(t=>({
    key:t.key, summary:t.summary, epic:t.epic, story:t.parent, role:t.role,
    epicOrder: PRI.epics.indexOf(t.epic)+1,
    storyOrderInEpic: (PRI.storiesByEpic[t.epic]||[]).indexOf(t.parent)+1,
    taskOrderInStory: (PRI.tasksByStory[t.parent]||[]).indexOf(t.key)+1,
    start:t.start, end:t.end, resource:t.resource, status:t.status, category:t.category,
  })).sort((a,b)=>a.epicOrder-b.epicOrder || a.storyOrderInEpic-b.storyOrderInEpic
    || (PRI_ROLE_PHASE[a.role]??99)-(PRI_ROLE_PHASE[b.role]??99) || a.taskOrderInStory-b.taskOrderInStory);
  const payload={
    exportedAt: new Date().toISOString(),
    note: "Приоритеты и даты, пересчитанные вручную (drag&drop) на странице Гант B2BAPP. epicOrder/storyOrderInEpic/taskOrderInStory — порядковые номера приоритета для переноса в Jira (например, числовым префиксом summary или отдельным полем ранга). start/end — расчётные даты начала/конца по новому порядку.",
    criticalEnd: PRI_CRIT?PRI_CRIT.end:null,
    criticalResource: PRI_CRIT?PRI_CRIT.resource:null,
    tasks,
  };
  const blob=new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=`b2bapp-gantt-priorities-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  priFlash('Файл выгружен.');
}

function findLastItem(key){ return LAST_ITEMS.find(i=>i.key===key); }

function handleReorder(draggedKey, targetKey){
  if(draggedKey===targetKey) return;
  const dragged=findLastItem(draggedKey), target=findLastItem(targetKey);
  if(!dragged || !target) return;
  if(dragged.type!==target.type){ priFlash('Можно менять местами только элементы одного уровня.'); return; }
  if(dragged.type==='epic'){
    const arr=PRI.epics, from=arr.indexOf(draggedKey), to=arr.indexOf(targetKey);
    if(from<0||to<0) return;
    arr.splice(from,1); arr.splice(to,0,draggedKey);
  } else if(dragged.type==='story'){
    if(dragged.parent!==target.parent){ priFlash('Стори можно переставлять только внутри одного эпика.'); return; }
    const arr=PRI.storiesByEpic[dragged.parent]||[], from=arr.indexOf(draggedKey), to=arr.indexOf(targetKey);
    if(from<0||to<0) return;
    arr.splice(from,1); arr.splice(to,0,draggedKey);
  } else if(dragged.type==='task'){
    if(dragged.parent!==target.parent){ priFlash('Задачи можно переставлять только внутри одной стори.'); return; }
    const arr=PRI.tasksByStory[dragged.parent]||[], from=arr.indexOf(draggedKey), to=arr.indexOf(targetKey);
    if(from<0||to<0) return;
    arr.splice(from,1); arr.splice(to,0,draggedKey);
  } else return;
  recomputeAndRender();
}

function attachDragHandlers(){
  $('ganttTree').querySelectorAll('.gantt2-row[data-key]').forEach(rowEl=>{
    rowEl.addEventListener('dragstart', e=>{
      e.dataTransfer.setData('text/plain', rowEl.dataset.key);
      e.dataTransfer.effectAllowed='move';
      rowEl.classList.add('pri-dragging');
    });
    rowEl.addEventListener('dragend', ()=>rowEl.classList.remove('pri-dragging'));
    rowEl.addEventListener('dragover', e=>{ e.preventDefault(); rowEl.classList.add('pri-dragover'); });
    rowEl.addEventListener('dragleave', ()=>rowEl.classList.remove('pri-dragover'));
    rowEl.addEventListener('drop', e=>{
      e.preventDefault();
      rowEl.classList.remove('pri-dragover');
      const draggedKey=e.dataTransfer.getData('text/plain');
      handleReorder(draggedKey, rowEl.dataset.key);
    });
    rowEl.setAttribute('draggable','true');
  });
}

function renderGanttV2(){
  const data=CURRENT_DATA;
  let gv=data.ganttV2;
  if(Array.isArray(gv)) gv = gv.length ? adaptFlatGanttV2(gv, data) : null;
  if(!gv || !gv.items || !gv.items.length){
    $('ganttEmpty').innerHTML=renderEmptyState('Нет данных, запустите обновление (скилл b2bapp-dashboard-refresh)');
    $('ganttApp').style.display='none';
    return;
  }
  $('ganttEmpty').innerHTML='';
  $('ganttApp').style.display='block';
  if(gv._flatAdapted){
    $('ganttEmpty').innerHTML=`<div class="note-banner" style="background:rgba(255,107,61,.08);border:1px solid rgba(255,107,61,.3);border-radius:8px;padding:10px 14px;font-size:12px;color:var(--mute);margin-bottom:14px">⚠ Скилл ещё не даёт story/task-уровень в ganttV2 — показан агрегат по ролям внутри эпика (наведи на бар — детали). Разверни ⌄ эпик, чтобы увидеть роли.</div>`;
  }

  const effectiveItems = (PRI_MODE && PRI_ITEMS) ? PRI_ITEMS : gv.items;
  const resourceFilteredItems = filterItemsByResource(effectiveItems, GS.resourceFilter);
  LAST_ITEMS = effectiveItems;
  const RESOURCE_NAME={}; (gv.resources||[]).forEach(r=>{RESOURCE_NAME[r.id]=(r.name||'').split(' ')[0];});

  const items=resourceFilteredItems;
  const tree=buildTree(items);
  // new Date(null) не даёт NaN (превращается в эпоху 1970-01-01), поэтому пустые
  // start/end (стори без дочерних задач — у скилла такое бывает) сначала
  // отсеиваются явной проверкой, иначе одна такая запись растягивает всю шкалу
  // на десятки лишних лет.
  const dates=items.filter(i=>i.start && i.end).flatMap(i=>[new Date(i.start),new Date(i.end)]).filter(d=>!isNaN(d));
  if(!dates.length){$('ganttEmpty').innerHTML=renderEmptyState('Нет корректных дат в ganttV2');$('ganttApp').style.display='none';return;}
  const minD=new Date(Math.min(...dates)); minD.setDate(minD.getDate()-3);
  const maxD=new Date(Math.max(...dates)); maxD.setDate(maxD.getDate()+3);
  GS._minD=minD; // используется zoomAroundAnchor(), чтобы пересчитывать scrollLeft при смене масштаба
  const totalDays=Math.max(1,Math.round((maxD-minD)/86400000));
  const totalPx=totalDays*GS.pxPerDay;
  const xOf=ds=>{const t=new Date(ds); return isNaN(t)?0:Math.round((t-minD)/86400000*GS.pxPerDay);};
  const widthOf=(s,e)=>Math.max(3,xOf(e)-xOf(s));

  const forceExpand = !!GS.resourceFilter;
  const rows=[];
  if(GS.resourceFilter){
    // «Лесенка»: для выбранного исполнителя показываем только его задачи, в
    // хронологическом порядке выполнения (по дате начала) — не в порядке
    // эпик→стори из дерева, — чтобы видеть, как одна задача идёт за другой.
    const EPIC_NAME={}; items.forEach(i=>{ if(i.type==='epic') EPIC_NAME[i.key]=spaceify(i.summary||''); });
    items.filter(i=>i.type==='task' && i.resource===GS.resourceFilter && i.start)
      .sort((a,b)=>new Date(a.start)-new Date(b.start))
      .forEach(node=>rows.push({node,depth:0,ladder:true,epicName:EPIC_NAME[node.epic]||''}));
  } else {
    const taskOnly = GS.level==='task';
    function walk(node,depth){
      if(!taskOnly || node.type==='task') rows.push({node,depth});
      const isExpanded = taskOnly || GS.expanded.has(node.key);
      if(node.type==='epic' && GS.level==='epic')return;
      if(node.children && node.children.length && isExpanded){
        node.children.forEach(c=>{
          if(node.type==='story' && GS.level==='story')return;
          walk(c,depth+1);
        });
      }
    }
    tree.forEach(e=>walk(e,0));
  }

  // Отступ строится по ТИПУ узла (эпик/стори/задача), а не по глубине рекурсии —
  // задачи, привязанные напрямую к эпику (без стори), иначе оказывались бы на
  // уровне отступа "стори" и визуально не выстраивались в один столбец с
  // остальными задачами ("пляшущие" строки).
  const TYPE_INDENT={epic:0,story:1,task:2};
  $('ganttTree').innerHTML=rows.map(({node,epicName,ladder})=>{
      const hasChildren=node.children && node.children.length>0;
      const isExpanded=forceExpand || GS.expanded.has(node.key);
      const toggle=hasChildren?`<span class="gantt2-toggle" data-key="${node.key}">${isExpanded?'▾':'▸'}</span>`:'<span class="gantt2-toggle-spacer"></span>';
      const typeIcon=`<span class="g2-type-icon">${TYPE_ICON[node.type]||TYPE_ICON.task}</span>`;
      const roleChip=node.role?`<span class="g2-role-chip" style="background:${ROLE_COLOR[node.role]||'#7f8fa6'}">${node.role}</span>`:'';
      const label=spaceify(node.summary||'');
      const hoursNote=node.type!=='epic'&&node.estimateH?` <span style="color:var(--mute);font-size:9px">(${node.spentH||0}/${node.estimateH}ч)</span>`:'';
      const epicNote=epicName?` <span style="color:var(--mute);font-size:9px">· ${epicName.slice(0,28)}</span>`:'';
      const indentPx=ladder ? 8 : TYPE_INDENT[node.type]*18+8;
      const priHandle='<svg class="pri-handle" viewBox="0 0 10 16"><circle cx="3" cy="3" r="1.4" fill="currentColor" opacity=".6"/><circle cx="7" cy="3" r="1.4" fill="currentColor" opacity=".6"/><circle cx="3" cy="8" r="1.4" fill="currentColor" opacity=".6"/><circle cx="7" cy="8" r="1.4" fill="currentColor" opacity=".6"/><circle cx="3" cy="13" r="1.4" fill="currentColor" opacity=".6"/><circle cx="7" cy="13" r="1.4" fill="currentColor" opacity=".6"/></svg>';
      return `<div class="gantt2-row" data-key="${node.key}" data-type="${node.type}" data-parent="${node.parent||''}" data-epic="${node.epic||''}"><div class="gantt2-label" title="${label.replace(/"/g,'&quot;')}" style="padding-left:${indentPx}px">${priHandle}${toggle}${typeIcon}${roleChip}${jiraLink(node.key)} ${label.slice(0,32)}${hoursNote}${epicNote}</div></div>`;
    }).join('');
  $('ganttTree').querySelectorAll('.gantt2-toggle[data-key]').forEach(t=>{
    t.onclick=()=>{ const k=t.dataset.key; GS.expanded.has(k)?GS.expanded.delete(k):GS.expanded.add(k); renderGanttV2(); };
  });
  $('ganttTree').closest('.gantt2-tree').classList.toggle('pri-active', PRI_MODE);
  if(PRI_MODE) attachDragHandlers();

  const marks=buildRulerMarks(minD,maxD,GS.scale,GS.pxPerDay);
  $('ganttRuler').style.width=totalPx+'px';
  $('ganttRuler').innerHTML=marks.map(m=>`<div class="gantt2-ruler-mark" style="left:${m.x}px">${m.label}</div>`).join('');

  let baselineItems=null;
  if(GS.baseline){
    const bl=(data.baselines||[]).find(b=>b.id===GS.baseline);
    if(bl && bl.items && bl.items.length){ baselineItems={}; bl.items.forEach(it=>baselineItems[it.key]=it); }
  }

  const rowsHtml=rows.map(({node})=>{
    if(!node.start || !node.end){
      // Нет дат (стори без дочерних задач и т.п.) — показываем пустую строку
      // без бара, а не рисуем мусорную позицию на эпохе 1970 года.
      return `<div class="gantt2-row" style="color:var(--mute);font-size:9px;padding-left:8px">нет дат</div>`;
    }
    const color=ROLE_COLOR[node.role]||'#7f8fa6';
    const x=xOf(node.start), w=widthOf(node.start,node.end);
    const est=node.estimateH||0, spent=node.spentH||0;
    const progress=est?Math.min(100,Math.round(spent/est*100)):0;
    const overspent=est>0 && spent>est;
    const activeSpend=spent>0 && !overspent;
    const fillColor=overspent?'rgba(231,76,60,.65)':activeSpend?'rgba(46,204,113,.6)':'rgba(0,0,0,.35)';
    const catClass=(node.category==='done'?'g2-done':node.category==='in_progress'?'g2-inprogress':'g2-planned')+(overspent?' g2-overspent':'');
    const assigneeName=node.type==='task' && node.resource ? (RESOURCE_NAME[node.resource]||'') : '';
    let ghost='';
    if(baselineItems && baselineItems[node.key]){
      const b=baselineItems[node.key];
      ghost=`<div class="gantt2-bar-ghost" style="left:${xOf(b.start)}px;width:${widthOf(b.start,b.end)}px"></div>`;
    }
    return `<div class="gantt2-row">${ghost}<div class="gantt2-bar ${catClass}${node.onCriticalPath?' g2-crit':''}" style="left:${x}px;width:${w}px;background:${color}"
      data-tip-key="${node.key}" data-tip-summary="${spaceify(node.summary||'').replace(/"/g,'&quot;')}" data-tip-resource="${node.resource||''}"
      data-tip-est="${est}" data-tip-spent="${spent}" data-tip-start="${node.start||''}" data-tip-end="${node.end||''}" data-tip-status="${node.status||''}">
      <div class="gantt2-bar-fill" style="width:${progress}%;background:${fillColor}"></div>
      ${assigneeName?`<div class="gantt2-bar-name">${assigneeName}</div>`:''}
    </div></div>`;
  }).join('');
  $('ganttRows').style.width=totalPx+'px';
  $('ganttRows').style.position='relative';
  $('ganttRows').innerHTML=rowsHtml;

  const overlayH=rows.length*26;
  const today=new Date(), todayX=xOf(today.toISOString().slice(0,10));
  if(GS.showToday && todayX>=0 && todayX<=totalPx) $('ganttRows').insertAdjacentHTML('beforeend',`<div class="gantt2-today-line" style="left:${todayX}px;height:${overlayH}px" title="Сегодня"></div>`);
  const mvpX=xOf('2026-12-10');
  if(GS.showMilestone && mvpX>=0 && mvpX<=totalPx) $('ganttRows').insertAdjacentHTML('beforeend',`<div class="gantt2-milestone-line" style="left:${mvpX}px;height:${overlayH}px" title="Веха MVP 10.12.2026"></div>`);
  if(GS.showHires) (gv.resources||[]).forEach(r=>{
    if(!r.from)return;
    const hx=xOf(r.from);
    if(hx>=0 && hx<=totalPx) $('ganttRows').insertAdjacentHTML('beforeend',`<div class="gantt2-hire-line" style="left:${hx}px;height:${overlayH}px" title="Выход: ${r.name||r.role} (${r.from})"></div>`);
  });

  // Первая отрисовка после загрузки данных — прокручиваем таймлайн так, чтобы
  // линия "сегодня" сразу была в видимой области (не за краем экрана).
  // Синхронно, без requestAnimationFrame: браузер уже применил style.width к
  // #ganttRuler/#ganttRows выше, так что scrollWidth/clientWidth корректны
  // сразу (rAF на фоновой/неактивной вкладке может не сработать вовремя).
  if(!GS._scrolledToToday && todayX>=0 && todayX<=totalPx){
    GS._scrolledToToday=true;
    const scroller=$('ganttScroll');
    scroller.scrollLeft=Math.max(0, todayX - scroller.clientWidth/2);
  }

  $('ganttLegend').innerHTML=
    `<span><span class="g2-type-icon">${TYPE_ICON.epic}</span> Эпик</span>`+
    `<span><span class="g2-type-icon">${TYPE_ICON.story}</span> Стори</span>`+
    `<span><span class="g2-type-icon">${TYPE_ICON.task}</span> Задача</span>`+
    Object.entries(ROLE_COLOR).map(([r,c])=>`<span><span class="sw" style="background:${c}"></span>${r}</span>`).join('')+
    `<span style="margin-left:12px"><span class="sw" style="background:var(--err)"></span>критический путь (обводка)</span>`+
    `<span><span class="sw" style="background:#00d4ff"></span>сегодня</span>`+
    `<span><span class="sw" style="background:#9b59b6"></span>веха 10.12.2026</span>`+
    `<span><span class="sw" style="background:var(--blue)"></span>выход сотрудника (наём/старт)</span>`+
    `<span><span class="sw" style="background:#2ecc71"></span>идёт списание времени</span>`+
    `<span><span class="sw" style="background:#e74c3c"></span>⚠ списано больше оценки</span>`;

  initGanttTooltip();

  const assum=data.ganttAssumptions||{};
  let cpe=data.criticalPathExplained||{};
  if(PRI_MODE && PRI_CRIT){
    const okDeadline = PRI_CRIT.end && PRI_CRIT.end<='2026-12-10';
    cpe={...cpe, endDate:PRI_CRIT.end, resource:PRI_CRIT.resource,
      conclusion: `[Пересчитано вручную] ${okDeadline?'Успеваем к 10.12.2026':'НЕ успеваем'}: критпуть до ${PRI_CRIT.end||'—'} (ресурс ${PRI_CRIT.resource||'—'})`};
  }
  $('ganttAssumptions').innerHTML=`
    <div>🔴 <b>Критический путь:</b> ${cpe.conclusion||'—'}</div>
    ${(cpe.steps&&cpe.steps.length)?`<div style="margin-top:8px"><b>Шаги:</b></div><ul class="assum-list">${cpe.steps.map(s=>`<li>${s}</li>`).join('')}</ul>`:''}
    ${assum.roleAssumptions?`<div style="margin-top:10px"><b>Допущения по ролям:</b></div><ul class="assum-list">${Object.entries(assum.roleAssumptions).map(([r,a])=>`<li><b>${r}</b>: ${a}</li>`).join('')}</ul>`:''}
    <div style="margin-top:8px;color:var(--mute);font-size:11px">Часов в дне: ${gv.workCalendar?.hoursPerDay||8} · праздников учтено: ${(gv.workCalendar?.holidays||[]).length} · сгенерировано: ${gv.generatedAt||'—'}</div>
  `;

  const blSel=$('baselineSelect');
  if(blSel.dataset.populated!=='1'){
    blSel.innerHTML='<option value="">—</option>'+(data.baselines||[]).map(b=>`<option value="${b.id}">${b.label||b.ts}</option>`).join('');
    blSel.dataset.populated='1';
    blSel.onchange=()=>{ GS.baseline=blSel.value; renderGanttV2(); };
  }

  const resSel=$('resourceFilter');
  if(resSel.dataset.populated!=='1'){
    resSel.innerHTML='<option value="">Все</option>'+(gv.resources||[]).map(r=>`<option value="${r.id}">${r.name||r.id} (${r.role})</option>`).join('');
    resSel.dataset.populated='1';
    resSel.onchange=()=>{ GS.resourceFilter=resSel.value; renderGanttV2(); };
  }
}

// Возвращает дату-якорь для зума: если "сегодня" сейчас видно в области
// прокрутки — якорь это "сегодня" (она должна остаться по центру после зума).
// Если "сегодня" не видно — якорь это дата, которая сейчас в центре экрана
// (то, что видел пользователь, должно остаться в центре и после зума).
function zoomAnchorDate(){
  if(!GS._minD) return null;
  const scroller=$('ganttScroll');
  const pxPerDayNow=GS.pxPerDay;
  const todayX=Math.round((new Date()-GS._minD)/86400000*pxPerDayNow);
  const viewLeft=scroller.scrollLeft, viewRight=scroller.scrollLeft+scroller.clientWidth;
  if(todayX>=viewLeft && todayX<=viewRight) return new Date();
  const centerX=scroller.scrollLeft+scroller.clientWidth/2;
  const d=new Date(GS._minD); d.setDate(d.getDate()+centerX/pxPerDayNow);
  return d;
}
function zoomTo(newPxPerDay){
  const anchor=zoomAnchorDate();
  GS.pxPerDay=Math.max(1,Math.min(60,newPxPerDay));
  renderGanttV2();
  if(anchor && GS._minD){
    const scroller=$('ganttScroll');
    const x=Math.round((anchor-GS._minD)/86400000*GS.pxPerDay);
    scroller.scrollLeft=Math.max(0, x-scroller.clientWidth/2);
  }
}

document.querySelectorAll('.gantt2-toolbar-group button[data-scale]').forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll('.gantt2-toolbar-group button[data-scale]').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on');
    GS.scale=btn.dataset.scale;
    zoomTo(SCALE_PX[GS.scale]);
  };
});
$('zoomIn').onclick=()=>zoomTo(GS.pxPerDay+2);
$('zoomOut').onclick=()=>zoomTo(GS.pxPerDay-2);
$('levelFilter').onchange=e=>{ GS.level=e.target.value; renderGanttV2(); };
$('expandSelect').onchange=e=>{
  const v=e.target.value;
  if(v==='all') allExpandableKeys(LAST_ITEMS).forEach(k=>GS.expanded.add(k));
  else if(v==='epics'){
    GS.expanded.clear();
    const epicKeys=new Set(LAST_ITEMS.filter(i=>i.type==='epic').map(i=>i.key));
    allExpandableKeys(LAST_ITEMS).forEach(k=>{ if(epicKeys.has(k)) GS.expanded.add(k); });
  }
  else if(v==='collapse') GS.expanded.clear();
  e.target.selectedIndex=0;
  renderGanttV2();
};
$('todayBtn').onclick=()=>{ GS._scrolledToToday=false; renderGanttV2(); };
$('lineToday').onchange=e=>{ GS.showToday=e.target.checked; renderGanttV2(); };
$('lineMilestone').onchange=e=>{ GS.showMilestone=e.target.checked; renderGanttV2(); };
$('lineHires').onchange=e=>{ GS.showHires=e.target.checked; renderGanttV2(); };
$('treeCollapseBtn').onclick=toggleTreeCollapsed;
$('fullscreenBtn').onclick=toggleFullscreen;
$('priModeBtn').onclick=togglePriorityMode;
$('priResetBtn').onclick=resetPriorityOrder;
$('priExportBtn').onclick=exportPriorityOrder;
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && document.body.classList.contains('g2-fullscreen')) toggleFullscreen();
});
setTreeWidth(GS.treeWidth);
setupTreeResizer();
setupGanttPan();

// Зум колёсиком мыши с Ctrl, либо жестом pinch на тачпаде (Chrome/Firefox шлют
// такие жесты как wheel-событие с ctrlKey=true).
$('ganttScroll').addEventListener('wheel', e=>{
  if(!e.ctrlKey) return;
  e.preventDefault();
  zoomTo(GS.pxPerDay+(e.deltaY>0?-2:2));
}, {passive:false});

AUTH_READY.then(()=>{
fetch('../data/data.json?t='+Date.now()).then(r=>r.json()).then(d=>{
  document.getElementById('upd').textContent=d.updated||'—';
  CURRENT_DATA=d;
  renderGanttV2();
}).catch(showFetchError);
});
</script>
</div><!-- /main --></div><!-- /layout -->
